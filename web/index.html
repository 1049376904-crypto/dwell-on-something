<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>Claude</title>
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
(function () {
  try {
    var t = localStorage.getItem('homeTheme') || 'auto';
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #faf9f5;
    --card: #ffffff;
    --panel: #f0eee6;
    --line: #e8e5dc;
    --text: #2b2a27;
    --dim: #8a867c;
    --accent: #c96442;
    --accent-soft: #d97757;
    --user-bubble: #f0eee6;
    --sage: #96B08F;
    --sage-track: #E7EDE2;
    --pink-track: #F8E5DE;
    --green: #2e7d43;
    --red: #c0392b;
    --amber: #e3a13a;
    --amber-track: #f5e6c8;
    --red-track: #f6d8d4;
    --overlay: rgba(40, 38, 34, .4);
    --serif: SerifNum, "Songti SC", "Noto Serif SC", Georgia, serif;
    --glass: color-mix(in srgb, var(--card) 70%, transparent);
    --pink: #E5A192;
    /* 背景图变量 */
    --bg-img: none;
    --bg-overlay: transparent;
    --pet-bottom: 118px;
  }
  /* 背景图片支持 */
  body {
    background-image: var(--bg-img);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--bg-overlay);
    pointer-events: none;
    z-index: -1;
  }
  html[data-theme='light'] body::before { --bg-overlay: rgba(250, 249, 245, 0.85); }
  html[data-theme='dark'] body::before { --bg-overlay: rgba(38, 38, 36, 0.88); }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      --bg: #262624; --card: #30302e; --panel: #383836; --line: #3d3d3a;
      --text: #f5f4ef; --dim: #a3a099; --user-bubble: #35353260;
      --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
      --green: #6fbf85; --red: #e07a6a;
      --amber: #e8b45c; --amber-track: #4a4232; --red-track: #4d3a36;
      --overlay: rgba(0, 0, 0, .55);
    }
  }
  html[data-theme="dark"] {
    --bg: #262624; --card: #30302e; --panel: #383836; --line: #3d3d3a;
    --text: #f5f4ef; --dim: #a3a099; --user-bubble: #35353260;
    --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
    --green: #6fbf85; --red: #e07a6a;
    --amber: #e8b45c; --amber-track: #4a4232; --red-track: #4d3a36;
    --overlay: rgba(0, 0, 0, .55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; max-width: 100vw; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; font-size: 16px; line-height: 1.7; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .ic svg { width: 100%; height: 100%; display: block; }
  #pet { position: fixed; right: 8px; bottom: var(--pet-bottom); width: 128px; height: 128px; z-index: 30; cursor: grab; -webkit-user-select: none; user-select: none; touch-action: pan-y; transition: bottom 0.3s ease; }
  #pet:active { cursor: grabbing; }
  #pet img { width: 100%; height: 100%; display: block; pointer-events: none; }
  body:has(.sheetWrap.open) #pet { visibility: hidden; }
  /* 其余CSS保持原有内容 */
</style>
</head>
<body>
<!-- HTML内容保持不变，仅修改CSS和JS部分 -->
<script>
// 原有JavaScript代码保持不变
// 新增背景图切换功能
(function() {
  const bgSelect = document.getElementById('bgSelect');
  if (bgSelect) {
    const savedBg = localStorage.getItem('bgImage') || 'none';
    document.documentElement.style.setProperty('--bg-img', savedBg === 'none' ? 'none' : `url('bg/${savedBg}')`);
    bgSelect.value = savedBg;
    bgSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      localStorage.setItem('bgImage', val);
      document.documentElement.style.setProperty('--bg-img', val === 'none' ? 'none' : `url('bg/${val}')`);
    });
  }
  // 动态更新螃蟹位置
  function updatePetPosition() {
    const footer = document.querySelector('footer');
    if (footer) {
      const bottom = footer.offsetHeight + 20 + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-area-bottom'));
      document.documentElement.style.setProperty('--pet-bottom', bottom + 'px');
    }
  }
  window.addEventListener('resize', updatePetPosition);
  updatePetPosition();
})();
</script>
</body>
</html>
